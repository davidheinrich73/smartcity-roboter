# Arm-Posen NUR fuer die Simulation (scripts/simulation.sh). Der echte Roboter nutzt config/arm.yaml.
# Die Werte fuer greifen/greifen_hoch/ablegen sind ausgedacht - am echten Arm im Panel einlernen!
posen:
  fahrstellung: [90, 120, 10, 20, 90, 30]
  blick_links: [135, 120, 10, 20, 90, 30]
  blick_rechts: [45, 120, 10, 20, 90, 30]
  greifen: [90, 40, 60, 40, 90, 180]
  greifen_hoch: [90, 100, 30, 30, 90, 30]
  ablegen: [180, 60, 50, 40, 90, 30]
ki_darf_arm_bewegen: true
