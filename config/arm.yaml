# Arm-Posen (Grad je Servo 1-6). Weitere ueber das Panel (Seite Arm) speichern.
# Werte aus den Yahboom-Programmen auf dem Roboter (Greifer dort 0, hier 30 = kleinster erlaubter Wert):
#   fahrstellung   = Startstellung der Gamepad-Steuerung (yahboom_joy_M3Pro.py), die nach dem
#                    Einschalten automatisch angefahren wird -> damit lief unser Linienfolger.
#   yahboom_linie  = Stellung von Yahboms eigenem Linienfolger (largemodel_arm/follow_line.py)
#   pruefblick     = noch nicht festgelegt -> im Panel einstellen und speichern
#   blick_links/rechts = Umschauen am Zebrastreifen
# ki_darf_arm_bewegen: true = KI darf den Arm bewegen (nur im STAND und nur mit eingelernten Posen):
#   - unklare LiDAR-Meldung: kurz in den "pruefblick" schauen
#   - Zebrastreifen: nach links/rechts schauen (blick_links, blick_rechts)
#   - kleines Hindernis aufheben und zur Seite legen (greifen, greifen_hoch, ablegen)
#   Danach immer zurueck in die "fahrstellung".
posen:
  fahrstellung: [90, 120, 10, 20, 90, 30]
  yahboom_linie: [90, 90, 12, 20, 90, 30]
  # Umschauen am Zebrastreifen: Fahrstellung, Servo 1 um 45 Grad gedreht.
  # RICHTUNG UNGEPRUEFT: zeigt "blick_links" nach rechts, die beiden Werte (135/45) tauschen.
  blick_links: [135, 120, 10, 20, 90, 30]
  blick_rechts: [45, 120, 10, 20, 90, 30]
  # Aufheben: 'greifen' (Arm unten vor dem Roboter, Greifer offen/zu egal),
  # 'greifen_hoch' (mit Gegenstand angehoben), 'ablegen' (zur Seite neben die Strasse)
  # -> im Panel einlernen, dann erscheinen sie hier.
ki_darf_arm_bewegen: false
