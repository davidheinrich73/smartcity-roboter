# Arm-Posen (Grad je Servo 1-6). Weitere ueber das Panel (Seite Arm) speichern.
# Werte aus den Yahboom-Programmen auf dem Roboter (Greifer dort 0, hier 30 = kleinster erlaubter Wert):
#   fahrstellung   = Startstellung der Gamepad-Steuerung (yahboom_joy_M3Pro.py), die nach dem
#                    Einschalten automatisch angefahren wird -> damit lief unser Linienfolger.
#   yahboom_linie  = Stellung von Yahboms eigenem Linienfolger (largemodel_arm/follow_line.py)
#   pruefblick     = noch nicht festgelegt -> im Panel einstellen und speichern
# ki_darf_arm_bewegen: true = KI darf bei unklarer LiDAR-Meldung im STAND kurz in den
#   "pruefblick" schauen und danach zurueck in die "fahrstellung" (erst wenn beide Posen da sind).
posen:
  fahrstellung: [90, 120, 10, 20, 90, 30]
  yahboom_linie: [90, 90, 12, 20, 90, 30]
ki_darf_arm_bewegen: false
